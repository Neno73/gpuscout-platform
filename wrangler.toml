name = "gpuscout-platform"
main = "src/worker.ts"
compatibility_date = "2024-01-20"
compatibility_flags = ["nodejs_compat"]

[env.development]
name = "gpuscout-platform-dev"

[env.staging]
name = "gpuscout-platform-staging"

[env.production]
name = "gpuscout-platform"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "gpuscout-db"
database_id = "950466a5-ce47-4edc-989a-5701f60aabdf"

# KV for rate limiting and sessions  
[[kv_namespaces]]
binding = "CACHE"
id = "546589c0cee64695b08d26d75f9d1795"

# Environment variables
[vars]
APP_URL = "https://gpuscout.ai"
JWT_EXPIRES_IN = "1h"
REFRESH_TOKEN_EXPIRES_IN = "7d"

# Secrets (set via wrangler secret put)
# JWT_SECRET
# SENDGRID_API_KEY
# DISCORD_WEBHOOK_URL